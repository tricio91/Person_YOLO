[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "person-detector"
version = "0.1.0"
description = "YOLOv8 person detector fine-tuned on CrowdHuman, exported to ONNX/OpenVINO"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ultralytics>=8.2.0",
    "numpy>=1.23",
    "opencv-python>=4.5",
    "pillow>=9.0",   # header-only image size reads during .odgt conversion
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "onnxslim>=0.1.31",   # graph simplification during the ONNX export
    "openvino>=2024.0",
]

# NNCF: INT8 quantization for the OpenVINO export only, ONNX doesn't use it. Skip it
# otherwise, it pulls in a fair amount of extra weight.
[project.optional-dependencies]
quantize = ["nncf>=2.8"]

[project.scripts]
person-detect = "person_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
